---
name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  # ── 0. Makefile lint ───────────────────────────────────────────────────
  makefile-lint:
    name: Makefile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Install checkmake
        run: go install github.com/checkmake/checkmake/cmd/checkmake@latest

      - name: checkmake
        run: checkmake Makefile

  # ── 1. Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: Install lint tools
        run: pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint ansible/site.yml
        env:
          ANSIBLE_ROLES_PATH: ansible/roles

  # ── 2. Syntax check ────────────────────────────────────────────────────
  # No vault needed — secrets come from env vars at deploy time.
  # Mock env vars injected here so lookup('env', ...) resolves to dummies.
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check — SIEM server play
        run: |
          ansible-playbook --syntax-check \
            -i ansible/inventory/hosts.ini \
            ansible/site.yml
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          ANSIBLE_COLLECTIONS_PATH: ~/.ansible/collections
          # Mock values so lookup('env', ...) resolves during syntax check
          SIEM_SERVER_IP: "10.0.0.1"
          SIEM_SERVER_HOST: "siem.local"
          SIEM_SERVER_USER: "ci"
          POSTGRESQL_SERVER_IP: "10.0.0.1"
          POSTGRESQL_SERVER_USER: "ci"
          REDIS_SERVER_IP: "10.0.0.4"
          REDIS_SERVER_USER: "ci"
          GRAFANA_ADMIN_PASSWORD: "ci-dummy"
          WAZUH_API_PASSWORD: "Ci-Dummy1!"
          WAZUH_ENROLLMENT_PASSWORD: "ci-dummy"
          POSTGRESQL_PASSWORD: "ci-dummy"
          REDIS_PASSWORD: "ci-dummy-redis"
          INFISICAL_ENCRYPTION_KEY: "aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899"
          INFISICAL_AUTH_SECRET: "ci-dummy-auth-secret"
          INFISICAL_SITE_URL: "http://10.0.0.1:8080"

  # ── 2b. Preflight secret guard ─────────────────────────────────────────
  # Proves the preflight role fails fast on an empty environment (the
  # silent-empty `infisical run` injection failure mode) and passes when
  # all required secrets are present.
  preflight-guard:
    name: Preflight secret guard
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: Install Ansible
        run: pip install ansible-core

      - name: Preflight passes when all required secrets are present
        run: |
          ansible-playbook ansible/ci/preflight-test.yml \
            -i ansible/ci/mock-inventory.ini
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          GRAFANA_ADMIN_PASSWORD: "ci-dummy"
          WAZUH_API_PASSWORD: "Ci-Dummy1!"
          POSTGRESQL_PASSWORD: "ci-dummy"
          REDIS_PASSWORD: "ci-dummy-redis"
          DISCORD_WEBHOOK_URL: "https://discord.example/ci-dummy-webhook"

      # No secret env vars set here — mimics `infisical run` exiting 0 while
      # injecting nothing (machine identity without project access).
      - name: Preflight fails when the environment is empty
        run: |
          set -euo pipefail
          if output=$(ansible-playbook ansible/ci/preflight-test.yml \
              -i ansible/ci/mock-inventory.ini 2>&1); then
            echo "::error::preflight guard passed with an empty environment — it must fail"
            echo "$output"
            exit 1
          fi
          echo "$output" | grep -q "machine identity" \
            || { echo "::error::preflight failure message does not point at the Infisical machine identity"; echo "$output"; exit 1; }
          echo "Preflight correctly aborted on empty environment."
        env:
          ANSIBLE_ROLES_PATH: ansible/roles

  # ── 3. Template rendering ──────────────────────────────────────────────
  # Renders every .j2 template with mock vars.
  # Runs yamllint on the rendered YAML outputs (lgtm templates).
  # Alloy .alloy configs are shown for human inspection.
  template-render:
    name: Template render
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: Install Ansible + yamllint
        run: pip install ansible-core yamllint

      - name: Render all templates
        run: |
          ansible-playbook ansible/ci/render-templates.yml \
            -i ansible/ci/mock-inventory.ini \
            -e @ansible/ci/mock-vars.yml
        env:
          ANSIBLE_ROLES_PATH: ansible/roles

      - name: Re-render infisical.env with Google SSO configured (exercises the conditional block)
        run: |
          ansible-playbook ansible/ci/render-templates.yml \
            -i ansible/ci/mock-inventory.ini \
            -e @ansible/ci/mock-vars.yml \
            -e @ansible/ci/mock-vars-sso.yml \
            --tags infisical_env
        env:
          ANSIBLE_ROLES_PATH: ansible/roles

      - name: Validate rendered YAML files
        run: |
          yamllint \
            /tmp/rendered/prometheus.yml \
            /tmp/rendered/loki-config.yaml \
            /tmp/rendered/grafana-datasources.yaml \
            /tmp/rendered/docker-compose.lgtm.yml \
            /tmp/rendered/docker-compose.infisical.yml

      - name: Validate rendered Infisical config
        run: |
          set -euo pipefail

          # No unrendered Jinja placeholders leaked into the output
          for f in /tmp/rendered/infisical.env /tmp/rendered/infisical-sso.env; do
            if grep -q '{{' "$f"; then
              echo "::error::$f still contains an unrendered Jinja placeholder"
              exit 1
            fi
          done

          # Required keys Infisical needs to boot must always be present
          for key in NODE_ENV PORT SITE_URL DB_CONNECTION_URI REDIS_URL ENCRYPTION_KEY AUTH_SECRET; do
            grep -q "^${key}=" /tmp/rendered/infisical.env \
              || { echo "::error::infisical.env is missing required key ${key}"; exit 1; }
          done

          # Google SSO block must be absent when unconfigured, present when configured
          if grep -q '^CLIENT_ID_GOOGLE_LOGIN=' /tmp/rendered/infisical.env; then
            echo "::error::CLIENT_ID_GOOGLE_LOGIN should not render when Google OAuth is unset"
            exit 1
          fi
          grep -q '^CLIENT_ID_GOOGLE_LOGIN=ci-test-google-client-id$' /tmp/rendered/infisical-sso.env \
            || { echo "::error::infisical-sso.env did not render the Google OAuth block"; exit 1; }
          grep -q '^CLIENT_SECRET_GOOGLE_LOGIN=ci-test-google-client-secret$' /tmp/rendered/infisical-sso.env \
            || { echo "::error::infisical-sso.env did not render the Google OAuth secret"; exit 1; }

          # Guard against the deprecated -postgres tag suffix (dropped upstream as of v0.147.0)
          # and against the image tag drifting from the pinned infisical_version var.
          version=$(sed -nE 's/^infisical_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' ansible/ci/mock-vars.yml)
          if [[ -z "$version" ]]; then
            echo "::error::could not extract infisical_version from ansible/ci/mock-vars.yml"
            exit 1
          fi

          # mock-vars.yml is what this job actually renders and checks below — if it
          # drifts from the real production pin, all the checks below pass while
          # verifying the wrong version. Keep the two in lockstep.
          prod_version=$(sed -nE 's/^infisical_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' ansible/group_vars/all/vars.yml)
          if [[ -z "$prod_version" ]]; then
            echo "::error::could not extract infisical_version from ansible/group_vars/all/vars.yml"
            exit 1
          fi
          if [[ "$prod_version" != "$version" ]]; then
            echo "::error::infisical_version differs between group_vars/all/vars.yml (${prod_version}) and ansible/ci/mock-vars.yml (${version})"
            exit 1
          fi

          # End-anchored so a hard-coded suffixed tag in the template (e.g.
          # "v0.162.5-postgres") can't slip past a substring match against "v0.162.5".
          grep -q "image: infisical/infisical:${version}\$" /tmp/rendered/docker-compose.infisical.yml \
            || { echo "::error::docker-compose.infisical.yml image tag does not match infisical_version (${version})"; exit 1; }
          if [[ "$version" == *-postgres ]]; then
            echo "::error::infisical_version '${version}' uses the deprecated -postgres tag suffix (dropped upstream as of v0.147.0)"
            exit 1
          fi

      - name: Validate rendered PostgreSQL backup script
        run: |
          set -euo pipefail

          # pg-backup.service runs this as OS user postgres over the local socket,
          # which uses peer auth (OS user must equal the DB role). Passing -U here
          # reintroduces "Peer authentication failed" — this broke every nightly
          # backup silently until it was caught by manual inspection, not CI.
          if grep -qE 'pg_dump[^|]*-U[[:space:]]' /tmp/rendered/pg-backup.sh; then
            echo "::error::pg-backup.sh passes -U to pg_dump, breaking peer auth for the postgres OS user running the backup (see pg-backup.service User=)."
            echo "::error::Backups must connect as the postgres role, not infisical_db_user — pg_dump should have no -U flag."
            exit 1
          fi
          grep -q '^pg_dump -Fc' /tmp/rendered/pg-backup.sh \
            || { echo "::error::pg-backup.sh does not contain the expected pg_dump -Fc invocation"; exit 1; }

      - name: Show rendered Alloy configs
        run: |
          echo "=== alloy-server.alloy ===" && cat /tmp/rendered/alloy-server.alloy

      - name: Upload rendered templates as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-templates
          path: /tmp/rendered/
          retention-days: 7
