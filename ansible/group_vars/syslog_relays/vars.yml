---
# syslog_relay role — forwards the Sakamoto UDM-SE's syslog to Alloy on
# siem_server. The UDM sends to sak2 (UniFi: Activity Logging → SIEM server
# 10.77.12.181:515); sak2 passes each datagram on unchanged. Alloy sets
# site=sakamoto from the port it arrives on and host from the message body,
# so the relay changes no labels. See docs/unifi.md.
syslog_relay_listen_port: 515
# sak2's own subnet (br2) only. The UniFi syslog target applies to every
# device at the site, so this admits the UDM (10.77.12.1) and any UniFi gear
# addressed in 10.77.12.0/24 (e.g. USW Flex 2.5G 5). Devices on the
# management VLAN 10.77.11.0/24 (U7 Pro XG, USW Pro HD 24 PoE, USW Flex 8s)
# are deliberately still dropped. One CIDR only: it is socat's range=.
syslog_relay_allowed_source: 10.77.12.0/24
syslog_relay_target: "{{ siem_server_tailscale_ip }}:{{ unifi_syslog_port_sak }}"
