---
# =============================================================================
# Connection & identity — sourced from .env (never committed)
# =============================================================================
siem_server_ip: "{{ lookup('env', 'SIEM_SERVER_IP') }}"
siem_server_host: "{{ lookup('env', 'SIEM_SERVER_HOST') }}"
# How Sakamoto hosts reach siem_server (laf3): its Tailscale address. sak2 does
# not accept Tailscale subnet routes and the UniFi site-to-site VPN is gone
# (deleted 2026-09-30), so 10.77.3.0/24 is unreachable from Sakamoto.
siem_server_tailscale_ip: 100.80.24.51
postgresql_server_ip: "{{ lookup('env', 'POSTGRESQL_SERVER_IP') }}"
redis_server_ip: "{{ lookup('env', 'REDIS_SERVER_IP') }}"

# =============================================================================
# Secrets — sourced from .env (never committed)
# =============================================================================
vault_grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
smtp_host: "{{ lookup('env', 'SMTP_HOST') }}"
smtp_from: "{{ lookup('env', 'SMTP_FROM') }}"
smtp_starttls_policy: "{{ lookup('env', 'SMTP_STARTTLS_POLICY') }}"
vault_wazuh_api_password: "{{ lookup('env', 'WAZUH_API_PASSWORD') }}"
vault_wazuh_indexer_admin_password: "{{ lookup('env', 'WAZUH_INDEXER_ADMIN_PASSWORD') }}"
vault_wazuh_kibanaserver_password: "{{ lookup('env', 'WAZUH_KIBANASERVER_PASSWORD') }}"
vault_wazuh_indexer_admin_hash: "{{ lookup('env', 'WAZUH_INDEXER_ADMIN_HASH') }}"
vault_wazuh_kibanaserver_hash: "{{ lookup('env', 'WAZUH_KIBANASERVER_HASH') }}"
vault_postgresql_password: "{{ lookup('env', 'POSTGRESQL_PASSWORD') }}"
vault_redis_password: "{{ lookup('env', 'REDIS_PASSWORD') }}"
vault_infisical_encryption_key: "{{ lookup('env', 'INFISICAL_ENCRYPTION_KEY') }}"
vault_infisical_auth_secret: "{{ lookup('env', 'INFISICAL_AUTH_SECRET') }}"
infisical_site_url: "{{ lookup('env', 'INFISICAL_SITE_URL') }}"
# Public CF Tunnel URL (optional) — set SITE_URL to this for correct OAuth redirect URIs
infisical_external_url: "{{ lookup('env', 'INFISICAL_EXTERNAL_URL') | default('', true) }}"
# Google OAuth credentials (optional) — enables Sign in with Google
vault_infisical_client_id_google: "{{ lookup('env', 'INFISICAL_CLIENT_ID_GOOGLE') | default('', true) }}"
vault_infisical_client_secret_google: "{{ lookup('env', 'INFISICAL_CLIENT_SECRET_GOOGLE') | default('', true) }}"

# =============================================================================
# Directory layout (safe to commit)
# =============================================================================
siem_base_dir: /opt/siem
siem_config_dir: /opt/siem/config
siem_data_dir: /opt/siem/data

# =============================================================================
# Ports (safe to commit)
# =============================================================================
grafana_port: 3000
prometheus_port: 9090
loki_port: 3100
alloy_ui_port: 12345
unpoller_port: 9130          # every unpoller-<name> container; not published on the host
unifi_syslog_port_laf: 514
unifi_syslog_port_sak: 515
wazuh_agent_port: 1514
wazuh_enrollment_port: 1515
wazuh_api_port: 55000
wazuh_indexer_port: 9200
wazuh_dashboard_port: 5601
wazuh_cf_proxy_port: 5600
wazuh_debug_port: 5602       # LAN-accessible debug port — no JWT check, fixed proxy user
infisical_port: 8080
redis_port: 6379

# =============================================================================
# Image / package versions (safe to commit — bump here to upgrade)
# =============================================================================
grafana_version: "11.5.2"
loki_version: "3.4.2"
prometheus_version: "v3.3.0"
alloy_version: "1.15.1"
unpoller_version: "v2.11.2"
wazuh_version: "4.14"
wazuh_docker_version: "4.14.5"
wazuh_indexer_heap: "4g"
wazuh_indexer_mem_limit: "6g"           # Docker cgroup hard cap (RAM + swap combined via memswap_limit)
wazuh_indexer_gc_opts: "-XX:-UseG1GC -XX:+UseZGC -XX:ZCollectionInterval=60"
  # ZGC replaces G1GC to prevent safepoint-stall crashes on this 16K-page kernel.
  # G1GC stop-the-world evacuation requires ALL JVM threads to reach a safepoint
  # simultaneously; a thread blocked in kernel memory compaction can never do so,
  # causing a 60s+ hang → BCM2835 watchdog → hard reset.
  # ZGC is fully concurrent and imposes no such constraint.
  # ZCollectionInterval=60 prevents Eden accumulating >2GB between GC cycles.
wazuh_indexer_cluster_name: "wazuh-cluster"
wazuh_indexer_node_name: "wazuh-indexer-laf3"
wazuh_dashboard_external_url: "{{ lookup('env', 'WAZUH_DASHBOARD_EXTERNAL_URL') | default('', true) }}"
wazuh_active_response_whitelist:
  - "127.0.0.1"
infisical_version: "v0.162.5"
postgresql_version: "16"
redis_dashboard_id: 763
redis_dashboard_revision: 1

# =============================================================================
# Grafana external access
# =============================================================================
# Public URL Grafana embeds in alert links. Set to Cloudflare Tunnel URL when exposed.
grafana_external_url: "{{ lookup('env', 'GRAFANA_EXTERNAL_URL') | default('', true) }}"
# Cloudflare Access team name (<team>.cloudflareaccess.com). Enables JWT auth when set.
cloudflare_team_name: "{{ lookup('env', 'CLOUDFLARE_TEAM_NAME') | default('', true) }}"
# Comma-separated emails granted Grafana Admin via the Cloudflare JWT. Empty → all JWT users are Viewers.
grafana_admin_emails: "{{ lookup('env', 'GRAFANA_ADMIN_EMAILS') | default('', true) }}"

# =============================================================================
# Alerting (optional — omit env var to disable that channel)
# =============================================================================
alert_email: "{{ lookup('env', 'ALERT_EMAIL') }}"
discord_webhook_url: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"

# ntfy — crash alerts via systemd OnFailure and Docker event notifier
# Primary: self-hosted ntfy on laf2 (LAN); fallback: ntfy.sh free tier (cloud)
ntfy_port: 2586
# By IP: Grafana runs in Docker, where laf2.local (mDNS) does not resolve.
ntfy_server_ip: "{{ hostvars[groups['ntfy_servers'][0]]['ansible_host'] }}"
ntfy_topic: "{{ lookup('env', 'NTFY_TOPIC') | default('homelab', true) }}"
ntfy_token: "{{ lookup('env', 'NTFY_TOKEN') }}"
ntfy_cloud_topic: "{{ lookup('env', 'NTFY_CLOUD_TOPIC') }}"

# =============================================================================
# Loki push clients (safe to commit)
# =============================================================================
# One entry per off-site client pushing logs through its own Cloudflare Tunnel
# hostname, push-<name>.<domain>. Each gets a dedicated Alloy loki.source.api
# on 127.0.0.1:<port>; job and site are set here and anything the client sends
# as stream labels is discarded.
# The port MUST match the ingress rule for push-<name> in cloudflared-deployment
# (config/laf3.local.yml), which also mints that hostname's service token.
# name: [a-z0-9_] only — it becomes an Alloy component label.
loki_push_clients:
  - name: visible           # Pixel 6a tethering while travelling (Visible line)
    port: 3501
    job: pixel6a
    site: lafayette

# =============================================================================
# Unpoller sites — one container per UniFi controller (safe to commit)
# =============================================================================
# Each entry becomes container unpoller-<name>, its own up.conf, and a
# Prometheus file_sd target carrying site=<site>. One process per controller so
# an unreachable or rejecting controller only blanks its own site — with both
# in one process, a Sakamoto timeout failed every poll and took Lafayette's
# metrics down with it (2026-09-30 → 10-18).
#
# Adding or removing a site: docs/unpoller-sites.md.
# name: [a-z0-9]+ only — container, file and DNS name on the lgtm network.
# site: Prometheus label. Use the same value Loki's syslog/push labels use for
#       that location, so dashboards can filter logs and metrics by one $site.
# url/user/pass: controller URL lives in .env, credentials in Infisical (they
#       must also be listed in infisical-secrets.template.env). The SITE1/SITE2
#       key names predate this list; new sites use their own name, e.g.
#       UNIFI_CONTROLLER_URL_USNEW.
unpoller_sites:
  - name: laf
    site: lafayette
    url: "{{ lookup('env', 'UNIFI_CONTROLLER_URL_SITE1') }}"
    user: "{{ lookup('env', 'UNIFI_USERNAME_SITE1') }}"
    pass: "{{ lookup('env', 'UNIFI_PASSWORD_SITE1') }}"
  - name: sak
    site: sakamoto
    url: "{{ lookup('env', 'UNIFI_CONTROLLER_URL_SITE2') }}"
    user: "{{ lookup('env', 'UNIFI_USERNAME_SITE2') }}"
    pass: "{{ lookup('env', 'UNIFI_PASSWORD_SITE2') }}"
# Derived — roles loop over these, never over the entries above: they hold
# credentials, and a failed loop item is printed whole.
unpoller_site_names: "{{ unpoller_sites | map(attribute='name') | list }}"

# =============================================================================
# PostgreSQL / Redis config (safe to commit)
# =============================================================================
infisical_db_name: infisical
infisical_db_user: infisical
redis_bind: "0.0.0.0"

# =============================================================================
# Backup config (safe to commit)
# =============================================================================
pg_backup_dir: /opt/siem/backups/postgresql
pg_backup_retain_days: 14
pg_backup_time: "02:00"
pg_backup_offsite_enabled: false
pg_backup_rclone_remote: ""
pg_backup_rclone_bucket: ""

# Log heartbeat — one LOG line every N minutes so the postgresql-log-silence
# alert stays meaningful on an idle instance (see roles/postgresql).
# Must be well under the alert's 10-minute silence window.
pg_log_heartbeat_interval_min: 5
