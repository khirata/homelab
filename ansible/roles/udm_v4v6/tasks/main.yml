---
# Polls the UDM-SE's WAN counters over SSH and leaves them for Alloy's
# textfile collector. Nothing is installed on the UDM: its side is one
# restricted line in authorized_keys, which this role prints but never writes
# (docs/udm-v4v6.md).
- name: Validate udm_v4v6 settings
  ansible.builtin.assert:
    that:
      - udm_v4v6_mode in ['native', 'mape', 'pppoe']
      - udm_v4v6_host | length > 0
      - udm_v4v6_from | length > 0
      - udm_v4v6_wan_if | length > 0 or udm_v4v6_mode == 'pppoe'
      - udm_v4v6_site is match('^[A-Za-z0-9_-]+$')
      - udm_v4v6_textfile_dir is match('^/')
    fail_msg: >-
      Set udm_v4v6_host, udm_v4v6_from, udm_v4v6_wan_if and udm_v4v6_site in
      group_vars/siem_server; udm_v4v6_mode must be native, mape or pppoe
      (got {{ udm_v4v6_mode }}).
    quiet: true

- name: Create udm-v4v6 system user
  ansible.builtin.user:
    name: udm-v4v6
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/udm_v4v6
    create_home: false

# 0755 so the service user can read known_hosts; the private key itself
# stays 0600 root and reaches the service via LoadCredential.
- name: Create udm_v4v6 config directory
  ansible.builtin.file:
    path: /etc/udm_v4v6
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate the UDM polling key (once)
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -C "udm_v4v6@{{ ansible_facts['hostname'] | default(inventory_hostname) }}" -f /etc/udm_v4v6/id_ed25519
    creates: /etc/udm_v4v6/id_ed25519

- name: Check for the UDM polling public key
  ansible.builtin.stat:
    path: /etc/udm_v4v6/id_ed25519.pub
  register: udm_v4v6_pubkey_stat

# Under --check on a fresh host the key was not really generated above.
- name: Read the UDM polling public key
  ansible.builtin.slurp:
    src: /etc/udm_v4v6/id_ed25519.pub
  register: udm_v4v6_pubkey
  check_mode: false  # read-only
  when: udm_v4v6_pubkey_stat.stat.exists

- name: Show the authorized_keys line the UDM needs
  ansible.builtin.debug:
    msg: >-
      restrict,from="{{ udm_v4v6_from | join(',') }}",command="{{ udm_v4v6_forced_command }}"
      {{ udm_v4v6_pubkey.content | b64decode | trim }}
  when: udm_v4v6_pubkey_stat.stat.exists

# Not keyscanned here: pinning whatever answers on first contact would trust
# it blindly. Pin it once by hand from a host that already trusts the UDM.
- name: Check the UDM host key is pinned
  ansible.builtin.stat:
    path: /etc/udm_v4v6/known_hosts
  register: udm_v4v6_known_hosts

- name: Fail when the UDM host key is not pinned
  ansible.builtin.fail:
    msg: >-
      /etc/udm_v4v6/known_hosts is missing on {{ inventory_hostname }}. Pin the
      UDM's host key after checking its fingerprint — docs/udm-v4v6.md, "Setup".
  when: not udm_v4v6_known_hosts.stat.exists

- name: Install udm_v4v6.sh
  ansible.builtin.copy:
    src: udm_v4v6.sh
    dest: /usr/local/bin/udm_v4v6.sh
    owner: root
    group: root
    mode: "0755"

- name: Template /etc/default/udm_v4v6
  ansible.builtin.template:
    src: udm_v4v6.env.j2
    dest: /etc/default/udm_v4v6
    owner: root
    group: root
    mode: "0644"

# The directory belongs to the textfile collector and other writers (e.g.
# rpi-metrics' rpi.prom), so it stays root-owned; an ACL lets the service user
# create and rename its own file there. The script writes a dot-file and
# renames it to udm_v4v6.prom, so Alloy never reads a half-written file.
- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ udm_v4v6_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Let udm-v4v6 write into the textfile collector directory
  ansible.posix.acl:
    path: "{{ udm_v4v6_textfile_dir }}"
    entity: udm-v4v6
    etype: user
    permissions: rwx
    state: present
  ignore_errors: "{{ ansible_check_mode }}"  # the user may not exist yet under --check

- name: Template udm_v4v6 systemd service
  ansible.builtin.template:
    src: udm_v4v6.service.j2
    dest: /etc/systemd/system/udm_v4v6.service
    owner: root
    group: root
    mode: "0644"

- name: Install udm_v4v6 systemd timer
  ansible.builtin.copy:
    src: udm_v4v6.timer
    dest: /etc/systemd/system/udm_v4v6.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start udm_v4v6 timer
  ansible.builtin.systemd:
    name: udm_v4v6.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
