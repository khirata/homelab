---
# Per-site values (UDM address, from= addresses, WAN interface, mode, site)
# live in group_vars/siem_server/vars.yml. Those below rarely change.
udm_v4v6_user: root
# native | mape | pppoe — see roles/udm_v4v6/files/udm_v4v6.sh
udm_v4v6_mode: native
udm_v4v6_ppp_if: ppp0
# mape only. Empty = the single ip6tnl* that is not the ip6tnl0 fallback.
udm_v4v6_tunnel_if: ""
# Must match the textfile directory of prometheus.exporter.unix in
# roles/alloy/templates/alloy-server.alloy.j2. The script writes
# udm_v4v6.prom there; Alloy remote-writes it with job="node".
udm_v4v6_textfile_dir: /var/lib/node_exporter/textfile_collector

# The UDM side. This key may only run this command, from the poller's
# addresses as the UDM sees them: added to /root/.ssh/authorized_keys on the
# UDM as
#   restrict,from="<addresses>",command="<this>" <public key>
# It prints every interface's counters, so switching mode or interface never
# needs a change on the UDM. See docs/udm-v4v6.md.
udm_v4v6_forced_command: >-
  cd /sys/class/net && grep -H . */statistics/rx_bytes */statistics/tx_bytes;
  cd /proc/net/dev_snmp6 && grep -HE '^Ip6(In|Out)Octets' *
