---
- name: Install Redis from Debian default repo
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true
  notify: Restart redis

- name: Template Redis config
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
  notify: Restart redis
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable and start Redis
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
