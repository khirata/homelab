---
- name: Set ntfy deb architecture
  ansible.builtin.set_fact:
    ntfy_deb_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download ntfy .deb from GitHub releases
  ansible.builtin.get_url:
    url: "https://github.com/binwiederhier/ntfy/releases/download/v{{ ntfy_version }}/ntfy_{{ ntfy_version }}_linux_{{ ntfy_deb_arch }}.deb"
    dest: "/tmp/ntfy_{{ ntfy_version }}_linux_{{ ntfy_deb_arch }}.deb"
    mode: "0644"
  check_mode: false

- name: Install ntfy .deb
  ansible.builtin.apt:
    deb: "/tmp/ntfy_{{ ntfy_version }}_linux_{{ ntfy_deb_arch }}.deb"
    state: present
  notify: Restart ntfy

- name: Create ntfy data directory
  ansible.builtin.file:
    path: /var/lib/ntfy
    state: directory
    owner: ntfy
    group: ntfy
    mode: "0750"

- name: Template ntfy server config
  ansible.builtin.template:
    src: server.yml.j2
    dest: /etc/ntfy/server.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart ntfy

- name: Enable and start ntfy
  ansible.builtin.systemd:
    name: ntfy
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remind operator to bootstrap ntfy user and token
  ansible.builtin.debug:
    msg: >-
      ntfy server deployed. Bootstrap steps (run once):
      1. ssh {{ inventory_hostname }} sudo ntfy user add --role=admin admin
      2. ssh {{ inventory_hostname }} sudo ntfy token add --expires=0 admin
      3. Copy the token into .env as NTFY_TOKEN, then re-run the playbook.
