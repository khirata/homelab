---
# Inherited from group_vars/all/vars.yml — listed here for role-level documentation.
# Override in group_vars or host_vars if needed.

# wazuh_version: "4.14"          (apt package pin — major.minor only)
# wazuh_docker_version: "4.14.5" (Docker image tag — full semver)
# wazuh_api_port: 55000
# wazuh_agent_port: 1514
# wazuh_enrollment_port: 1515
# wazuh_indexer_port: 9200
# wazuh_dashboard_port: 5601
# wazuh_cf_proxy_port: 5600
# wazuh_debug_port: 5602      (LAN debug — no JWT check, fixed proxy user)
# wazuh_indexer_heap: "4g"
# wazuh_indexer_mem_limit: "6g"          (Docker cgroup hard cap; memswap_limit set to same value)
# wazuh_indexer_gc_opts: "-XX:-UseG1GC -XX:+UseZGC -XX:ZCollectionInterval=60"
#                                         (ZGC prevents G1GC safepoint-stall watchdog crashes)
# wazuh_indexer_cluster_name: "wazuh-cluster"
# wazuh_indexer_node_name: "wazuh-indexer-laf3"
# wazuh_dashboard_external_url: ""
# wazuh_active_response_whitelist: ["127.0.0.1"]
# cloudflare_team_name: ""   (reused from LGTM role)
# siem_config_dir: /opt/siem/config
# siem_data_dir: /opt/siem/data
