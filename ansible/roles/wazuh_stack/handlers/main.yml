---
- name: Restart wazuh stack
  ansible.builtin.command:
    cmd: docker compose -f {{ siem_config_dir }}/docker-compose.wazuh.yml up -d --force-recreate
  changed_when: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart wazuh-manager
  ansible.builtin.systemd:
    name: wazuh-manager
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart filebeat
  ansible.builtin.systemd:
    name: filebeat
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
