---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart docker-event-notifier
  ansible.builtin.systemd:
    name: docker-event-notifier
    state: restarted
  register: _docker_event_notifier_restart
  failed_when:
    - _docker_event_notifier_restart.failed
    - "'Could not find the requested service' not in (_docker_event_notifier_restart.msg | default(''))"
  ignore_errors: "{{ ansible_check_mode }}"
