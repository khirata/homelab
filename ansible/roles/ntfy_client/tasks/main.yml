---
- name: Ensure python3 is installed
  ansible.builtin.apt:
    name: python3
    state: present

# Keep curl for any scripts that call it directly (e.g. docker-event-notifier)
- name: Ensure curl is installed
  ansible.builtin.apt:
    name: curl
    state: present

- name: Deploy ntfy-send Python script
  ansible.builtin.copy:
    src: ntfy-send
    dest: /usr/local/bin/ntfy-send
    owner: root
    group: root
    mode: "0755"

# force makes check mode pass on hosts where ntfy-send is not yet deployed
# (the copy above is only simulated in --check runs, so src would not exist)
- name: Create ntfy-clear symlink
  ansible.builtin.file:
    src: /usr/local/bin/ntfy-send
    dest: /usr/local/bin/ntfy-clear
    state: link
    force: true

- name: Deploy ntfy-client.conf
  ansible.builtin.template:
    src: ntfy-client.conf.j2
    dest: /etc/ntfy-client.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [ntfy_client_env]

# Keep env file — docker-event-notifier reads NTFY_TOKEN from it
- name: Deploy ntfy client env file
  ansible.builtin.template:
    src: ntfy-client.env.j2
    dest: /etc/ntfy-client.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [ntfy_client_env]
  notify: Restart docker-event-notifier

- name: Deploy notify-ntfy@ systemd template unit
  ansible.builtin.copy:
    src: notify-ntfy@.service
    dest: /etc/systemd/system/notify-ntfy@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# Remove old bash wrapper scripts (replaced by ntfy-send)
- name: Remove legacy ntfy-notify.sh
  ansible.builtin.file:
    path: /usr/local/bin/ntfy-notify.sh
    state: absent

- name: Remove legacy ntfy-clear.sh
  ansible.builtin.file:
    path: /usr/local/bin/ntfy-clear.sh
    state: absent

- name: Create alloy systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    mode: "0755"

- name: Add OnFailure drop-in for alloy
  ansible.builtin.copy:
    content: |
      [Unit]
      OnFailure=notify-ntfy@%n.service
    dest: /etc/systemd/system/alloy.service.d/ntfy.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
