---
# Mock variables for CI template rendering.
# Safe dummy values — exercises template logic without real credentials.
# Keep in sync with group_vars/all/vars.yml and all templates.

# --- Host / network ---
siem_server_ip: "10.0.0.1"
siem_server_host: "siem.local"
fleet_node_1_ip: "10.0.0.2"
fleet_node_2_ip: "10.0.0.3"
inventory_hostname: "localhost"

# --- Paths ---
siem_base_dir: /tmp/siem
siem_config_dir: /tmp/siem/config
siem_data_dir: /tmp/siem/data

# --- Ports ---
grafana_port: 3000
prometheus_port: 9090
loki_port: 3100
alloy_ui_port: 12345
unifi_syslog_port: 514
wazuh_agent_port: 1514
wazuh_enrollment_port: 1515
wazuh_api_port: 55000

# --- Versions ---
grafana_version: "11.5.2"
loki_version: "3.4.2"
prometheus_version: "v3.3.0"
alloy_version: "1.7.5"
wazuh_version: "4.10"

# --- Alloy ---
alloy_mode: server

# --- Prometheus scrape targets ---
prometheus_scrape_targets:
  - "10.0.0.1:12345"
  - "10.0.0.2:12345"
  - "10.0.0.3:12345"

# --- Vault variables (CI dummies — not real credentials) ---
vault_grafana_admin_password: "ci-test-password"
vault_wazuh_api_password: "Ci-Test-1!"
vault_wazuh_enrollment_password: "ci-test-password"
