---
# Mock variables for CI template rendering.
# Safe dummy values — exercises template logic without real credentials.
# Keep in sync with group_vars/all/vars.yml and all templates.

# --- Host / network ---
siem_server_ip: "10.0.0.1"
siem_server_host: "siem.local"
fleet_node_1_ip: "10.0.0.2"
fleet_node_2_ip: "10.0.0.3"
inventory_hostname: "localhost"

# --- Paths ---
siem_base_dir: /tmp/siem
siem_config_dir: /tmp/siem/config
siem_data_dir: /tmp/siem/data

# --- Ports ---
grafana_port: 3000
prometheus_port: 9090
loki_port: 3100
alloy_ui_port: 12345
unifi_syslog_port_laf: 514
unifi_syslog_port_sak: 515
wazuh_agent_port: 1514
wazuh_enrollment_port: 1515
wazuh_api_port: 55000

# --- Versions ---
grafana_version: "11.5.2"
loki_version: "3.4.2"
prometheus_version: "v3.3.0"
alloy_version: "1.7.5"
wazuh_version: "4.10"

# --- Alloy ---
alloy_mode: server

# --- Prometheus scrape targets ---
prometheus_scrape_targets:
  - "10.0.0.1:12345"
  - "10.0.0.2:12345"
  - "10.0.0.3:12345"

# --- Vault variables (CI dummies — not real credentials) ---
vault_grafana_admin_password: "ci-test-password"
vault_wazuh_api_password: "Ci-Test-1!"
vault_postgresql_password: "ci-test-db-password"
vault_redis_password: "ci-test-redis-password"
vault_infisical_encryption_key: "aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899"
vault_infisical_auth_secret: "ci-test-auth-secret-for-jwt-signing-only"
infisical_site_url: "http://10.0.0.1:8080"

# --- PostgreSQL / Redis ---
postgresql_version: "16"
infisical_db_name: infisical
infisical_db_user: infisical
redis_port: 6379
redis_bind: "0.0.0.0"
infisical_version: "v0.146.0-postgres"
infisical_port: 8080

# --- Backup ---
pg_backup_dir: /tmp/siem/backups/postgresql
pg_backup_retain_days: 14
pg_backup_time: "02:00"
pg_backup_offsite_enabled: false
pg_backup_rclone_remote: ""
pg_backup_rclone_bucket: ""
