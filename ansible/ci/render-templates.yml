---
# CI playbook — renders every Jinja2 template to /tmp/rendered/.
# Run against localhost with mock-vars.yml; validates that all template
# variables are defined and Jinja2 syntax is correct.
#
# Usage (from repo root):
#   ansible-playbook ansible/ci/render-templates.yml \
#     -i ansible/ci/mock-inventory.ini \
#     -e @ansible/ci/mock-vars.yml

- name: Render all Jinja2 templates
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    render_dir: /tmp/rendered

  tasks:
    - name: Create render output directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"
      tags: [always]

    # ── LGTM templates ────────────────────────────────────────────────────

    - name: Render docker-compose.lgtm.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/docker-compose.lgtm.yml.j2"
        dest: "{{ render_dir }}/docker-compose.lgtm.yml"
        mode: "0644"

    - name: Render prometheus.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/prometheus.yml.j2"
        dest: "{{ render_dir }}/prometheus.yml"
        mode: "0644"

    - name: Render loki-config.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/loki-config.yaml.j2"
        dest: "{{ render_dir }}/loki-config.yaml"
        mode: "0644"

    - name: Render grafana.ini
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/grafana.ini.j2"
        dest: "{{ render_dir }}/grafana.ini"
        mode: "0644"

    - name: Render grafana-datasources.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/grafana-datasources.yaml.j2"
        dest: "{{ render_dir }}/grafana-datasources.yaml"
        mode: "0644"

    - name: Render grafana-dashboard-provider.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/grafana-dashboard-provider.yaml.j2"
        dest: "{{ render_dir }}/grafana-dashboard-provider.yaml"
        mode: "0644"

    # The alerting templates escape Go template syntax as {{ '{{' }} $labels.x
    # so Grafana receives it verbatim. That is easy to break silently — a
    # mangled annotation still renders as valid YAML and only shows up in the
    # text of a fired alert. Render them so CI at least catches Jinja errors
    # and malformed YAML.
    - name: Render grafana-alerting-rules.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/grafana-alerting-rules.yaml.j2"
        dest: "{{ render_dir }}/grafana-alerting-rules.yaml"
        mode: "0644"

    - name: Render grafana-alerting-contact-points.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/grafana-alerting-contact-points.yaml.j2"
        dest: "{{ render_dir }}/grafana-alerting-contact-points.yaml"
        mode: "0644"

    - name: Render grafana-alerting-notification-policy.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/grafana-alerting-notification-policy.yaml.j2"
        dest: "{{ render_dir }}/grafana-alerting-notification-policy.yaml"
        mode: "0644"

    - name: Render unpoller.conf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/lgtm/templates/unpoller.conf.j2"
        dest: "{{ render_dir }}/unpoller.conf"
        mode: "0600"

    # ── Alloy templates ───────────────────────────────────────────────────

    - name: Render alloy-server.alloy (server mode)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/alloy/templates/alloy-server.alloy.j2"
        dest: "{{ render_dir }}/alloy-server.alloy"
        mode: "0644"

    # Rendered twice to cover both sides of the optional-exporter conditionals
    # (Redis / PostgreSQL logs / textfile collector).
    - name: Render alloy-node.alloy (node mode, optional exporters off)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/alloy/templates/alloy-node.alloy.j2"
        dest: "{{ render_dir }}/alloy-node-minimal.alloy"
        mode: "0644"
      vars:
        alloy_pg_log_dir: ""
        alloy_textfile_dir: ""
        alloy_redis_addr: ""

    - name: Render alloy-node.alloy (node mode, optional exporters on)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/alloy/templates/alloy-node.alloy.j2"
        dest: "{{ render_dir }}/alloy-node-full.alloy"
        mode: "0644"
      vars:
        alloy_pg_log_dir: /var/log/postgresql
        alloy_textfile_dir: /var/lib/node_exporter/textfile_collector
        alloy_redis_addr: "127.0.0.1:6379"

    # ── Redis / Infisical templates ───────────────────────────────────────

    - name: Render redis.conf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/redis/templates/redis.conf.j2"
        dest: "{{ render_dir }}/redis.conf"
        mode: "0644"

    - name: Render docker-compose.infisical.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/infisical/templates/docker-compose.infisical.yml.j2"
        dest: "{{ render_dir }}/docker-compose.infisical.yml"
        mode: "0644"

    # dest is parameterized so a second CI invocation can re-run just this task
    # (via --tags infisical_env) with an extra-vars overlay that sets the Google
    # OAuth vars, exercising the {% if %} block in infisical.env.j2. Extra-vars
    # (-e) outrank task-level `vars:`, so a same-run vars: override can't do this.
    - name: Render infisical.env
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/infisical/templates/infisical.env.j2"
        dest: "{{ infisical_env_dest | default(render_dir + '/infisical.env') }}"
        mode: "0644"
      tags: [infisical_env]

    - name: Render pg-backup.sh
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/postgresql/templates/pg-backup.sh.j2"
        dest: "{{ render_dir }}/pg-backup.sh"
        mode: "0644"

    - name: Render pg-log-heartbeat.service
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/postgresql/templates/pg-log-heartbeat.service.j2"
        dest: "{{ render_dir }}/pg-log-heartbeat.service"
        mode: "0644"

    - name: Render pg-log-heartbeat.timer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/postgresql/templates/pg-log-heartbeat.timer.j2"
        dest: "{{ render_dir }}/pg-log-heartbeat.timer"
        mode: "0644"

    - name: List rendered files
      ansible.builtin.find:
        paths: "{{ render_dir }}"
        patterns: "*"
      register: rendered_files

    - name: Show rendered file paths
      ansible.builtin.debug:
        msg: "{{ rendered_files.files | map(attribute='path') | list }}"
