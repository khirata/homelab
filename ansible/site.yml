---
# Fail fast if the injected environment is empty (e.g. the Infisical machine
# identity lost project access: `infisical run` exits 0 but injects zero
# secrets, and every lookup('env', ...) in group_vars renders empty).
# hosts: all + run_once (in the role) so it still fires under any --limit;
# assert executes on the controller, so no connection to hosts is needed.
- name: Preflight — verify injected secrets before any role runs
  hosts: all
  gather_facts: false
  become: false
  roles:
    - role: preflight
      tags: [always]

- name: Nodes
  hosts: nodes
  become: true
  vars:
    ansible_remote_tmp: /tmp
  roles:
    - ntfy_client
    - alloy
    - role: wazuh_agent
      tags: [wazuh_agent]

- name: Ntfy notification servers
  hosts: ntfy_servers
  become: true
  vars:
    ansible_remote_tmp: /tmp
  roles:
    - ntfy_server

- name: PostgreSQL server
  hosts: postgresql_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
    alloy_pg_log_dir: /var/log/postgresql
  roles:
    - ntfy_client
    - role: postgresql
      tags: [postgresql]
    - alloy

- name: Redis server
  hosts: redis_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
    alloy_redis_addr: "127.0.0.1:{{ redis_port }}"
  roles:
    - ntfy_client
    - redis
    - alloy

- name: SIEM server
  hosts: siem_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
    alloy_pg_log_dir: /var/log/postgresql
  roles:
    - role: docker
      tags: [docker]
    - ntfy_client
    - lgtm
    - wazuh_manager
    - role: wazuh_stack
      tags: [wazuh_stack]
    - alloy        # server mode: receives Unifi syslog on UDP/514
    - role: infisical
      tags: [infisical]
