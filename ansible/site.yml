---
- name: PostgreSQL server
  hosts: postgresql_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
  roles:
    - postgresql

- name: Redis server
  hosts: redis_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
  roles:
    - redis

- name: SIEM server
  hosts: siem_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
  roles:
    - docker
    - lgtm
    - wazuh_manager
    - alloy        # server mode: receives Unifi syslog on UDP/514
    - infisical
