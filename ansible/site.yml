---
- name: PostgreSQL server
  hosts: postgresql_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
    alloy_pg_log_dir: /var/log/postgresql
  roles:
    - postgresql
    - alloy

- name: Redis server
  hosts: redis_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
  roles:
    - redis
    - alloy

- name: SIEM server
  hosts: siem_server
  become: true
  vars:
    ansible_remote_tmp: /tmp
    alloy_pg_log_dir: /var/log/postgresql
  roles:
    - docker
    - lgtm
    - wazuh_manager
    - alloy        # server mode: receives Unifi syslog on UDP/514
    - infisical
